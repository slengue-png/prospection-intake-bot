name: Prospection Close Individual

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'envoi"
        required: true
        default: "individual"
        type: choice
        options:
          - individual
      run_date:
        description: "Date métier Europe/Paris (YYYY-MM-DD)"
        required: false
        default: ""
      agency:
        description: "Agence (GR|VR|GRS|SLS)"
        required: true
      initials:
        description: "Initiales collaborateur"
        required: true

concurrency:
  group: prospection-close-${{ github.event.inputs.agency }}-${{ github.event.inputs.initials }}-${{ github.event.inputs.run_date || 'today' }}
  cancel-in-progress: false

jobs:
  run-close:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set Paris date
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            echo "RUN_DATE=${{ github.event.inputs.run_date }}" >> $GITHUB_ENV
          else
            echo "RUN_DATE=$(TZ=Europe/Paris date +%F)" >> $GITHUB_ENV
          fi

      - name: Install system OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run close export
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}

          MAIL_ROUTING_JSON: ${{ secrets.MAIL_ROUTING_JSON }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}

          SEND_MODE: individual
          RUN_DATE: ${{ env.RUN_DATE }}
          AGENCY: ${{ github.event.inputs.agency }}
          INITIALS: ${{ github.event.inputs.initials }}
        run: |
          python scripts/export_and_mail.py
