name: Prospection Close Individual

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'envoi"
        required: true
        default: "individual"
        type: choice
        options:
          - individual
      run_date:
        description: "Date métier Europe/Paris (YYYY-MM-DD)"
        required: true
        type: string
      agency:
        description: "Agence (GR|VR|GRS|SLS)"
        required: true
        type: choice
        options:
          - GR
          - VR
          - GRS
          - SLS
      initials:
        description: "Initiales collaborateur"
        required: true
        type: string

concurrency:
  group: prospection-close-${{ github.event.inputs.agency }}-${{ github.event.inputs.initials }}-${{ github.event.inputs.run_date }}
  cancel-in-progress: false

jobs:
  run-close:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Validate inputs
        shell: bash
        run: |
          set -e

          MODE="${{ github.event.inputs.mode }}"
          RUN_DATE="${{ github.event.inputs.run_date }}"
          AGENCY="${{ github.event.inputs.agency }}"
          INITIALS="${{ github.event.inputs.initials }}"

          if [ "$MODE" != "individual" ]; then
            echo "Mode invalide: $MODE"
            exit 1
          fi

          case "$AGENCY" in
            GR|VR|GRS|SLS) ;;
            *) echo "Agence invalide: $AGENCY"; exit 1 ;;
          esac

          if ! echo "$RUN_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "RUN_DATE invalide: $RUN_DATE"
            exit 1
          fi

          if [ -z "$INITIALS" ]; then
            echo "INITIALS obligatoire"
            exit 1
          fi

      - name: Install system OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run close export
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}

          MAIL_ROUTING_JSON: ${{ secrets.MAIL_ROUTING_JSON }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}

          SEND_MODE: individual
          RUN_DATE: ${{ github.event.inputs.run_date }}
          AGENCY: ${{ github.event.inputs.agency }}
          INITIALS: ${{ github.event.inputs.initials }}

        run: |
          python scripts/export_and_mail.py