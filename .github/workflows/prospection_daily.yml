name: Prospection - Daily Recap

on:
  schedule:
    - cron: "45 15 * * *"   # 17:45 France (UTC+2 approx)
    - cron: "59 21 * * *"   # 23:59 France approx
  workflow_dispatch:

jobs:
  run-daily:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run daily export
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          EXPORT_BASE_URL: ${{ secrets.EXPORT_BASE_URL }}
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MODE: "daily"
        run: |
          python scripts/export_and_mail.py