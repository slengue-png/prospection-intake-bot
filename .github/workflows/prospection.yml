name: Prospection — Export & Mail

on:
  schedule:
    - cron: "30 11 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Export & mail
  env:
    EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
    BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
    BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
  run: python scripts/export_and_mail.py
