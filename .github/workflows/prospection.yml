name: Prospection

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'envoi"
        required: true
        default: individual
        type: choice
        options:
          - individual
          - agency_manager
          - admin

      run_date:
        description: "YYYY-MM-DD Europe/Paris (vide = aujourd'hui Paris)"
        required: false
        default: ""
        type: string

      agency:
        description: "Agence (requis si individual)"
        required: false
        default: VR
        type: choice
        options:
          - GR
          - VR
          - GRS
          - SLS

      initials:
        description: "Initiales (requis si individual)"
        required: false
        default: SL
        type: choice
        options:
          - JL
          - CZ
          - JB
          - LB
          - PV
          - ST
          - AC
          - SL

      max_ocr_images:
        description: "Nb max cartes (defaut: 50)"
        required: false
        default: "50"
        type: string

      max_photo_images:
        description: "Nb max photos (defaut: 15)"
        required: false
        default: "15"
        type: string

  schedule:
    # On lance souvent, et on garde un "guard" Paris => 17:45 et 23:59
    - cron: "*/5 * * * 1-5"

concurrency:
  group: prospection-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export_and_mail:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate inputs (dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          MODE="${{ inputs.mode }}"
          AGENCY="${{ inputs.agency }}"
          INITIALS="${{ inputs.initials }}"
          RUN_DATE="${{ inputs.run_date }}"

          if [[ ! "$MODE" =~ ^(individual|agency_manager|admin)$ ]]; then
            echo "::error::mode invalide: '$MODE'"
            exit 1
          fi

          if [ "$MODE" = "individual" ]; then
            if [ -z "$AGENCY" ]; then echo "::error::AGENCY requis pour mode=individual"; exit 1; fi
            if [ -z "$INITIALS" ]; then echo "::error::INITIALS requis pour mode=individual"; exit 1; fi
          fi

          if [ -n "$RUN_DATE" ]; then
            if ! [[ "$RUN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::RUN_DATE invalide: '$RUN_DATE' (YYYY-MM-DD)"
              exit 1
            fi
          fi

          echo "✅ Inputs validés."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: tesseract-ocr tesseract-ocr-fra libmagic1
          version: 1.0

      - name: Install system deps (fallback si cache miss)
        shell: bash
        run: |
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y tesseract-ocr tesseract-ocr-fra libmagic1
          else
            echo "✅ Tesseract déjà présent (cache)."
          fi

      - name: Install python deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine context (mode/date) + schedule guard
        id: ctx
        shell: bash
        run: |
          MODE="${{ inputs.mode }}"
          RUN_DATE="${{ inputs.run_date }}"
          SHOULD_RUN="1"

          # si schedule: on déclenche seulement aux heures cibles Paris
          if [ "${{ github.event_name }}" = "schedule" ]; then
            PARIS_HOUR=$(TZ="Europe/Paris" date +%H)
            PARIS_MIN=$(TZ="Europe/Paris" date +%M)
            echo "⏰ Paris now: ${PARIS_HOUR}:${PARIS_MIN}"

            # 17:45 => agency_manager
            if [ "$PARIS_HOUR" = "17" ] && [ "$PARIS_MIN" = "45" ]; then
              MODE="agency_manager"

            # 23:59 => admin
            elif [ "$PARIS_HOUR" = "23" ] && [ "$PARIS_MIN" = "59" ]; then
              MODE="admin"

            else
              SHOULD_RUN="0"
              MODE="skip"
              echo "🟡 Guard: pas l'heure cible (17:45 ou 23:59 Paris)."
            fi
          fi

          if [ -z "$RUN_DATE" ]; then
            RUN_DATE=$(TZ="Europe/Paris" date +%Y-%m-%d)
          fi

          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "run_date=$RUN_DATE" >> $GITHUB_OUTPUT
          echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT

      - name: Skip (schedule guard)
        if: ${{ steps.ctx.outputs.should_run != '1' }}
        run: |
          echo "✅ Skip propre: schedule hors 17:45/23:59 Paris."
          exit 0

      - name: Run export & mail
        env:
          WORKER_BASE_URL:        ${{ secrets.WORKER_BASE_URL }}
          EXPORT_TOKEN:           ${{ secrets.EXPORT_TOKEN }}
          TELEGRAM_TOKEN:         ${{ secrets.TELEGRAM_TOKEN }}

          BREVO_API_KEY:          ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL:     ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME:      ${{ secrets.BREVO_SENDER_NAME }}
          MAIL_ROUTING_JSON:      ${{ secrets.MAIL_ROUTING_JSON }}

          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_PLACES_API_KEY:  ${{ secrets.GOOGLE_PLACES_API_KEY }}

          SEND_MODE:              ${{ steps.ctx.outputs.mode }}
          RUN_DATE:               ${{ steps.ctx.outputs.run_date }}
          AGENCY:                 ${{ inputs.agency }}
          INITIALS:               ${{ inputs.initials }}

          MAX_OCR_IMAGES:         ${{ inputs.max_ocr_images }}
          MAX_PHOTO_IMAGES:       ${{ inputs.max_photo_images }}

          # ✅ IMPORTANT : on force le script à écrire dans /out
          OUT_DIR:                out

        shell: bash
        run: |
          echo "🚀 Lancement — mode=$SEND_MODE date=$RUN_DATE agency=$AGENCY initials=$INITIALS"
          python scripts/export_and_mail.py

      - name: Upload Excel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospection-${{ steps.ctx.outputs.mode }}-${{ steps.ctx.outputs.run_date }}-${{ github.run_id }}
          path: |
            out/**/*.xlsx
            out/**/*.zip
          retention-days: 7
          if-no-files-found: ignore

      - name: Notify failure via Telegram
        if: failure()
        env:
          TELEGRAM_TOKEN:         ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_ADMIN_CHAT_ID" ]; then
            echo "TELEGRAM_ADMIN_CHAT_ID manquant: notif ignorée."
            exit 0
          fi

          MSG="⚠️ Workflow PROSPECTION FAILED\n"
          MSG="${MSG}Mode : ${{ steps.ctx.outputs.mode }}\n"
          MSG="${MSG}Date : ${{ steps.ctx.outputs.run_date }}\n"
          MSG="${MSG}Agency : ${{ inputs.agency }}\n"
          MSG="${MSG}Run ID : ${{ github.run_id }}\n"
          MSG="${MSG}Repo : ${{ github.repository }}\n"
          MSG="${MSG}Lien : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_ADMIN_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d "parse_mode=HTML" \
            --max-time 10 \
            --retry 3 \
            --retry-delay 2