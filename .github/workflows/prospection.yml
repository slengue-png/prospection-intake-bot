name: Prospection — Export & Mail

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Date YYYY-MM-DD"
        required: false
        default: ""
      agency:
        description: "Agence"
        required: false
        default: ""
      initials:
        description: "Initiales"
        required: false
        default: ""
      visits_clients:
        description: "Visites clients"
        required: false
        default: ""
      visits_prospects:
        description: "Visites prospects"
        required: false
        default: ""
      commandes:
        description: "Commandes"
        required: false
        default: ""

jobs:
  export_mail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run export
        env:
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
          WORKER_DUMP_URL: ${{ secrets.WORKER_DUMP_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_TO_EMAILS: ${{ secrets.BREVO_TO_EMAILS }}

          RUN_DATE: ${{ github.event.inputs.run_date }}
          CLOSE_AGENCY: ${{ github.event.inputs.agency }}
          CLOSE_INITIALS: ${{ github.event.inputs.initials }}
          CLOSE_VISITS_CLIENTS: ${{ github.event.inputs.visits_clients }}
          CLOSE_VISITS_PROSPECTS: ${{ github.event.inputs.visits_prospects }}
          CLOSE_COMMANDES: ${{ github.event.inputs.commandes }}
        run: |
          python scripts/export_and_mail.py