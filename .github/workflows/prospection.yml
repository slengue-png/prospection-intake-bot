name: Prospection — Export & Mail

on:
  schedule:
    # GitHub Actions = UTC
    # 17:45 FR (hiver) = 16:45 UTC
    - cron: "45 16 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Date YYYY-MM-DD (optionnel) — sinon aujourd’hui"
        required: false
      agency:
        description: "Agence (optionnel)"
        required: false
      initials:
        description: "Initiales (optionnel)"
        required: false
      visits_clients:
        description: "Nb visites clients (optionnel)"
        required: false
      visits_prospects:
        description: "Nb visites prospects (optionnel)"
        required: false
      visites_commandes:
        description: "Nb visites commandes (optionnel)"
        required: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Export & mail
        env:
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          RUN_DATE: ${{ github.event.inputs.run_date }}
          AGENCY: ${{ github.event.inputs.agency }}
          INITIALS: ${{ github.event.inputs.initials }}
          VISITS_CLIENTS: ${{ github.event.inputs.visits_clients }}
          VISITS_PROSPECTS: ${{ github.event.inputs.visits_prospects }}
          VISITES_COMMANDES: ${{ github.event.inputs.visites_commandes }}
        run: python scripts/export_and_mail.py

      - name: Commit monthly cumul (data/)
        run: |
          git config user.name "prospection-bot"
          git config user.email "prospection-bot@users.noreply.github.com"

          git add data/ || true
          if git diff --cached --quiet; then
            echo "No cumul changes to commit."
            exit 0
          fi

          git commit -m "Update monthly cumul"
          git push