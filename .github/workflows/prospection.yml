name: Prospection

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode"
        required: true
        default: "individual"
        type: choice
        options: [individual, agency_manager, admin]

      run_date:
        description: "Date (YYYY-MM-DD). Vide = aujourd'hui Europe/Paris"
        required: false
        default: ""
        type: string

      agency:
        description: "Agence (requis si individual)"
        required: false
        type: choice
        options: [GR, VR, GRS, SLS]

      initials:
        description: "Initiales (requis si individual)"
        required: false
        type: choice
        options: [JL, CZ, JB, LB, PV, ST, AC, SL]

      debug:
        description: "DEBUG (0/1)"
        required: false
        default: "0"
        type: choice
        options: ["0","1"]

      max_ocr_images:
        description: "Max cartes (OCR)"
        required: false
        default: "50"
        type: string

      max_photo_images:
        description: "Max photos"
        required: false
        default: "15"
        type: string

jobs:
  export_and_mail:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (tesseract)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute RUN_DATE Paris if empty
        id: dates
        run: |
          RD="${{ inputs.run_date }}"
          if [ -z "$RD" ]; then
            RD=$(TZ="Europe/Paris" date +%Y-%m-%d)
          fi
          echo "run_date=$RD" >> $GITHUB_OUTPUT

      - name: Validate inputs
        run: |
          MODE="${{ inputs.mode }}"
          AGENCY="${{ inputs.agency }}"
          INITIALS="${{ inputs.initials }}"

          if [ "$MODE" = "individual" ]; then
            if [ -z "$AGENCY" ]; then echo "::error::AGENCY requis pour mode=individual"; exit 1; fi
            if [ -z "$INITIALS" ]; then echo "::error::INITIALS requis pour mode=individual"; exit 1; fi
          fi

      - name: Run export & mail
        env:
          WORKER_BASE_URL:        ${{ secrets.WORKER_BASE_URL }}
          EXPORT_TOKEN:           ${{ secrets.EXPORT_TOKEN }}
          TELEGRAM_TOKEN:         ${{ secrets.TELEGRAM_TOKEN }}

          BREVO_API_KEY:          ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL:     ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME:      ${{ secrets.BREVO_SENDER_NAME }}
          MAIL_ROUTING_JSON:      ${{ secrets.MAIL_ROUTING_JSON }}

          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_PLACES_API_KEY:  ${{ secrets.GOOGLE_PLACES_API_KEY }}

          SEND_MODE:              ${{ inputs.mode }}
          RUN_DATE:               ${{ steps.dates.outputs.run_date }}
          AGENCY:                 ${{ inputs.agency }}
          INITIALS:               ${{ inputs.initials }}

          MAX_OCR_IMAGES:         ${{ inputs.max_ocr_images }}
          MAX_PHOTO_IMAGES:       ${{ inputs.max_photo_images }}

          OUT_DIR:                out
          DEBUG:                  ${{ inputs.debug }}

        run: |
          echo "🚀 mode=$SEND_MODE date=$RUN_DATE agency=$AGENCY initials=$INITIALS debug=$DEBUG"
          python scripts/export_and_mail.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospection-${{ inputs.mode }}-${{ steps.dates.outputs.run_date }}-${{ github.run_id }}
          path: |
            out/**/*.xlsx
            out/**/*.zip
          retention-days: 7
          if-no-files-found: warn