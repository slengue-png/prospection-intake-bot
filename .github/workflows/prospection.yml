name: Prospection Export

on:
  workflow_dispatch:
    inputs:

      mode:
        description: "Mode d'envoi"
        type: choice
        required: true
        default: individual
        options:
          - individual
          - agency_manager
          - admin

      run_date:
        description: "Date (YYYY-MM-DD) — vide = aujourd'hui Europe/Paris"
        type: string
        required: false
        default: ""

      agency:
        description: "Agence (utile si mode=individual)"
        type: choice
        required: false
        default: VR
        options:
          - GR
          - VR
          - GRS
          - SLS

      initials:
        description: "Initiales (utile si mode=individual)"
        type: choice
        required: false
        default: SL
        options:
          - JL
          - CZ
          - JB
          - LB
          - PV
          - ST
          - AC
          - SL


  schedule:
    # Déclenche toutes les 15 minutes
    # Le script décidera si c'est 17h45 ou 23h59 Paris
    - cron: "*/15 * * * *"

concurrency:
  group: prospection-export
  cancel-in-progress: false


jobs:
  export:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      - name: Compute RUN_DATE (Europe/Paris)
        id: date
        shell: bash
        run: |
          if [ -n "${{ inputs.run_date }}" ]; then
            echo "RUN_DATE=${{ inputs.run_date }}" >> $GITHUB_OUTPUT
          else
            echo "RUN_DATE=$(TZ=Europe/Paris date +%F)" >> $GITHUB_OUTPUT
          fi


      - name: Debug inputs
        run: |
          echo "MODE=${{ inputs.mode }}"
          echo "DATE=${{ steps.date.outputs.RUN_DATE }}"
          echo "AGENCY=${{ inputs.agency }}"
          echo "INITIALS=${{ inputs.initials }}"


      - name: Run export
        env:

          # =========================
          # Worker / Telegram
          # =========================

          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

          # =========================
          # Brevo Mail
          # =========================

          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}

          # =========================
          # Enrichissement
          # =========================

          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # =========================
          # Routing (optionnel)
          # =========================

          MAIL_ROUTING_JSON: ${{ secrets.MAIL_ROUTING_JSON }}

          # =========================
          # Paramètres export
          # =========================

          SEND_MODE: ${{ inputs.mode }}
          RUN_DATE: ${{ steps.date.outputs.RUN_DATE }}
          AGENCY: ${{ inputs.agency }}
          INITIALS: ${{ inputs.initials }}

        run: |
          python scripts/export_and_mail.py