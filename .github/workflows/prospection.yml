name: prospection

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "individual | agency_manager | admin"
        required: false
        default: "individual"
        type: string
      run_date:
        description: "Date (YYYY-MM-DD) Europe/Paris"
        required: false
        type: string
      agency:
        description: "Agence (GR/VR/GRS/SLS...)"
        required: false
        type: string
      initials:
        description: "Initiales (JL/CZ/...)"
        required: false
        type: string

  schedule:
    - cron: "45 16 * * *"   # 17:45 Paris -> agency_manager
    - cron: "47 16 * * *"   # 17:47 Paris -> admin

jobs:
  export_and_mail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute mode for schedule
        id: sched
        run: |
          MODE="${{ inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "45 16 * * *" ]; then
              MODE="agency_manager"
            else
              MODE="admin"
            fi
          fi
          echo "MODE=$MODE" >> $GITHUB_OUTPUT

      - name: Run export & mail
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}

          MAIL_ROUTING_JSON: ${{ secrets.MAIL_ROUTING_JSON }}

          SEND_MODE: ${{ steps.sched.outputs.MODE }}
          RUN_DATE: ${{ inputs.run_date }}
          AGENCY: ${{ inputs.agency }}
          INITIALS: ${{ inputs.initials }}
        run: |
          python scripts/export_and_mail.py
