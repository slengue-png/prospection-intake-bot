name: Prospection Export

on:

  workflow_dispatch:
    inputs:

      mode:
        description: "Mode d'exécution"
        required: true
        default: "agency_manager"
        type: choice
        options:
          - individual
          - agency_manager
          - admin

      agency:
        description: "Agence (mode individual)"
        required: false
        default: ""

      initials:
        description: "Initiales (mode individual)"
        required: false
        default: ""

      run_date:
        description: "Date (YYYY-MM-DD)"
        required: false
        default: ""

  schedule:
    - cron: "45 15 * * *"   # 17:45 France
    - cron: "59 21 * * *"   # 23:59 France


jobs:

  export:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4


    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install dependencies
      run: |
        pip install -r requirements.txt


    # -----------------------------
    # Préparer le contexte
    # -----------------------------

    - name: Prepare context
      id: ctx
      run: |

        MODE="${{ inputs.mode }}"
        DATE="${{ inputs.run_date }}"

        if [ -z "$MODE" ]; then
          MODE="agency_manager"
        fi

        if [ -z "$DATE" ]; then
          DATE=$(date -u +%F)
        fi

        echo "mode=$MODE" >> $GITHUB_OUTPUT
        echo "run_date=$DATE" >> $GITHUB_OUTPUT
        echo "should_run=1" >> $GITHUB_OUTPUT


    # -----------------------------
    # Lancer export
    # -----------------------------

    - name: Run export & mail
      if: ${{ steps.ctx.outputs.should_run == '1' }}

      env:

        WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
        EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

        BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
        BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}

        MAIL_ROUTING_JSON: ${{ secrets.MAIL_ROUTING_JSON }}

        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}

        SEND_MODE: ${{ steps.ctx.outputs.mode }}
        RUN_DATE: ${{ steps.ctx.outputs.run_date }}

        AGENCY: ${{ inputs.agency }}
        INITIALS: ${{ inputs.initials }}

        MAX_OCR_IMAGES: 50
        MAX_PHOTO_IMAGES: 15

        OUT_DIR: out

      run: |

        echo "GEMINI length=${#GEMINI_API_KEY}"
        echo "PLACES length=${#GOOGLE_PLACES_API_KEY}"

        echo "🚀 Lancement — mode=$SEND_MODE date=$RUN_DATE agency=$AGENCY initials=$INITIALS"

        python scripts/export_and_mail.py