name: Prospection — Export & Mail

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Date YYYY-MM-DD (optionnel)"
        required: false
        default: ""
      agency:
        description: "Agence"
        required: false
        default: ""
      initials:
        description: "Initiales"
        required: false
        default: ""
      visits_clients:
        description: "Visites clients"
        required: false
        default: ""
      visits_prospects:
        description: "Visites prospects"
        required: false
        default: ""
      commandes:
        description: "Commandes"
        required: false
        default: ""

  schedule:
    # GitHub Actions = UTC
    - cron: "30 11 * * *"   # 12:30 FR (hiver)
    - cron: "0 16 * * *"    # 17:00 FR (hiver)

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Export & mail
        env:
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          RUN_DATE: ${{ inputs.run_date }}
          AGENCY: ${{ inputs.agency }}
          INITIALS: ${{ inputs.initials }}
          VISITS_CLIENTS: ${{ inputs.visits_clients }}
          VISITS_PROSPECTS: ${{ inputs.visits_prospects }}
          COMMANDES: ${{ inputs.commandes }}
        run: python scripts/export_and_mail.py

      - name: Commit monthly cumul (data/)
        run: |
          git config user.name "prospection-bot"
          git config user.email "prospection-bot@users.noreply.github.com"

          git add data/ || true
          if git diff --cached --quiet; then
            echo "No cumul changes to commit."
            exit 0
          fi

          git commit -m "Update monthly cumul"
          git push