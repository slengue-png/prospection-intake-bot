name: prospection

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Date (YYYY-MM-DD) Europe/Paris"
        required: true
        type: string
      agency:
        description: "Agence (GR/VR/GRS/SLS...)"
        required: true
        type: string
      initials:
        description: "Initiales collaborateur (JL/CZ/AC...)"
        required: true
        type: string
      visits_clients:
        description: "Nb visites clients"
        required: false
        default: ""
        type: string
      visits_prospects:
        description: "Nb visites prospects"
        required: false
        default: ""
        type: string
      commandes:
        description: "Nb commandes"
        required: false
        default: ""
        type: string

jobs:
  export_and_mail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run export & mail
        env:
          # Worker
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}        # ex: https://prospection-intake-worker.slengue.workers.dev
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}

          # Telegram (pour télécharger la photo carte via file_id)
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

          # Brevo SMTP API
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_FROM_EMAIL: ${{ secrets.BREVO_FROM_EMAIL }}      # ex: Prospection <prospection@pilopro.fr>
          BREVO_FROM_NAME: ${{ secrets.BREVO_FROM_NAME }}        # ex: Prospection Bot

          # Routage mails (JSON)
          MAIL_ROUTING_JSON: ${{ secrets.MAIL_ROUTING_JSON }}
          # Exemple (à mettre dans Secret):
          # {"GR":{"JL":["sam9999@free.fr"],"CZ":["slengue@gmail.com"],"_manager":["sam9999@free.fr"]},
          #  "VR":{"JB":["sam9999@free.fr"],"LB":["slengue@gmail.com"],"_manager":["sam9999@free.fr"]},
          #  "GRS":{"PV":["sam9999@free.fr"],"ST":["slengue@gmail.com"],"_manager":["sam9999@free.fr"]},
          #  "SLS":{"AC":["sam9999@free.fr"],"_manager":["sam9999@free.fr"]},
          #  "_admin":["samuel.lengue@ras-interim.fr"]}

          # Inputs dispatch
          RUN_DATE: ${{ inputs.run_date }}
          AGENCY: ${{ inputs.agency }}
          INITIALS: ${{ inputs.initials }}
          VISITS_CLIENTS: ${{ inputs.visits_clients }}
          VISITS_PROSPECTS: ${{ inputs.visits_prospects }}
          COMMANDES: ${{ inputs.commandes }}

          # Mode d'envoi :
          # - "individual" = mail immédiat collaborateur (filtré sur initials)
          # - "agency_manager" = consolidation agence (tous collaborateurs de l'agence)
          # - "admin" = consolidation globale (toutes agences)
          SEND_MODE: "individual"

        run: |
          python scripts/export_and_mail.py