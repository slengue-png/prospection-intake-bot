name: Prospection — Export & Mail

on:
  schedule:
    # GitHub Actions = UTC
    # 12:30 FR (hiver) = 11:30 UTC
    # 17:00 FR (hiver) = 16:00 UTC
    - cron: "30 11 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Date (optionnel) : YYYY-MM-DD"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      # ✅ DEBUG béton : on vérifie l'URL du worker et la résolution DNS côté GitHub
      - name: Debug worker connectivity
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
        run: |
          echo "WORKER_BASE_URL=$WORKER_BASE_URL"
          python - <<'PY'
          import os, socket, urllib.parse
          u = os.environ.get("WORKER_BASE_URL","").strip()
          print("RAW:", repr(u))
          if not u:
            raise SystemExit("Missing WORKER_BASE_URL secret")
          p = urllib.parse.urlparse(u)
          print("PARSED:", p)
          host = p.hostname
          print("HOST:", host)
          print("DNS:", socket.gethostbyname(host))
          PY
          echo "---- curl /health ----"
          curl -i "$WORKER_BASE_URL/health" || true

      - name: Export & mail
        env:
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          RUN_DATE: ${{ github.event.inputs.run_date }}
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
        run: python scripts/export_and_mail.py

      - name: Commit monthly cumul (data/)
        run: |
          git config user.name "prospection-bot"
          git config user.email "prospection-bot@users.noreply.github.com"

          git add data/ || true
          if git diff --cached --quiet; then
            echo "No cumul changes to commit."
            exit 0
          fi

          git commit -m "Update monthly cumul"
          git push