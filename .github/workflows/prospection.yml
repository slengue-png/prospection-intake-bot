name: Prospection — Export & Mail

on:
  schedule:
    - cron: "30 11 * * *"  # ~12:30 FR (selon heure GitHub)
    - cron: "0 16 * * *"   # ~17:00 FR (selon heure GitHub)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Export & mail (Brevo API)
        env:
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          # optionnel : forcer une date si besoin (sinon prend aujourd'hui UTC)
          # RUN_DATE: "2026-02-12"
        run: python scripts/export_and_mail.py
