# .github/workflows/prospection.yml
name: Prospection

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "individual | agency_manager | admin"
        required: true
        default: "individual"
        type: choice
        options: [individual, agency_manager, admin]
      run_date:
        description: "Date YYYY-MM-DD Europe/Paris (optionnel : auto)"
        required: false
        type: string
      agency:
        description: "Agence (GR/VR/GRS/SLS) - requis si individual"
        required: false
        type: string
      initials:
        description: "Initiales (JL/CZ/JB/LB/PV/ST/AC/SL) - requis si individual"
        required: false
        type: string

  # GitHub cron = UTC. On calcule RUN_DATE Europe/Paris dans le job.
  schedule:
    - cron: "45 16 * * *"   # 17:45 Europe/Paris en hiver (UTC+1) -> OK en pratique si tu acceptes un décalage en été
    - cron: "47 16 * * *"   # 17:47 Europe/Paris en hiver

jobs:
  export_and_mail:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ✅ Détermine SEND_MODE + RUN_DATE Europe/Paris
      - name: Compute mode + run_date (Europe/Paris)
        id: vars
        run: |
          # RUN_DATE: priorité à l'input workflow_dispatch, sinon date Europe/Paris
          if [ -n "${{ inputs.run_date }}" ]; then
            RUN_DATE="${{ inputs.run_date }}"
          else
            RUN_DATE="$(TZ=Europe/Paris date +%F)"
          fi

          # SEND_MODE: priorité à l'input dispatch, sinon selon schedule
          MODE="${{ inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # On distingue 17:45 vs 17:47 via github.event.schedule
            if [ "${{ github.event.schedule }}" = "45 16 * * *" ]; then
              MODE="agency_manager"
            else
              MODE="admin"
            fi
          fi

          echo "run_date=$RUN_DATE" >> $GITHUB_OUTPUT
          echo "mode=$MODE" >> $GITHUB_OUTPUT

      - name: Run export & mail
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}

          MAIL_ROUTING_JSON: ${{ secrets.MAIL_ROUTING_JSON }}

          SEND_MODE: ${{ steps.vars.outputs.mode }}
          RUN_DATE: ${{ steps.vars.outputs.run_date }}
          AGENCY: ${{ inputs.agency }}
          INITIALS: ${{ inputs.initials }}

          MAX_OCR_IMAGES: "50"

        run: |
          python scripts/export_and_mail.py