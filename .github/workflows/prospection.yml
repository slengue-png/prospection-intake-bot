name: Prospection

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "individual | agency_manager | admin"
        required: true
        default: "individual"
        type: string

      run_date:
        description: "YYYY-MM-DD (optionnel)"
        required: false
        type: string

      agency:
        description: "GR/VR/GRS/SLS (requis si individual)"
        required: false
        type: string

      initials:
        description: "JL/CZ/JB/LB/PV/ST/AC/SL (requis si individual)"
        required: false
        type: string

      visits_clients:
        description: "(optionnel)"
        required: false
        default: ""
        type: string

      visits_prospects:
        description: "(optionnel)"
        required: false
        default: ""
        type: string

      commandes:
        description: "(optionnel)"
        required: false
        default: ""
        type: string

  schedule:
    # 17:45 France (UTC+1 hiver / approx UTC+2 été)
    - cron: "45 16 * * *"
    # 17:47 France (admin SL)
    - cron: "47 16 * * *"

jobs:
  export_and_mail:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine execution mode
        id: mode
        run: |
          MODE="${{ inputs.mode }}"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "45 16 * * *" ]; then
              MODE="agency_manager"
            else
              MODE="admin"
            fi
          fi

          echo "mode=$MODE" >> $GITHUB_OUTPUT

      - name: Run export and mail script
        env:
          # Worker
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

          # Brevo
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}

          # Routing
          MAIL_ROUTING_JSON: ${{ secrets.MAIL_ROUTING_JSON }}

          # Gemini (OPTIONNEL)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Mode dynamique
          SEND_MODE: ${{ steps.mode.outputs.mode }}
          RUN_DATE: ${{ inputs.run_date }}
          AGENCY: ${{ inputs.agency }}
          INITIALS: ${{ inputs.initials }}

          # Compatibilité Worker
          VISITS_CLIENTS: ${{ inputs.visits_clients }}
          VISITS_PROSPECTS: ${{ inputs.visits_prospects }}
          COMMANDES: ${{ inputs.commandes }}

          MAX_OCR_IMAGES: "50"

        run: |
          python scripts/export_and_mail.py