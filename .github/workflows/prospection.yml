name: Prospection — Export & Mail

on:
workflow_dispatch:
inputs:
mode:
description: "instant | daily"
required: false
default: "instant"
run_date:
description: "Date: YYYY-MM-DD"
required: false
agency:
description: "Agence (GR/VR/GRS/SLS...)"
required: false
initials:
description: "Initiales (JL/CZ...)"
required: false
user_id:
description: "Telegram user id (optionnel)"
required: false

schedule:
# 17:45 FR (hiver UTC+1) = 16:45 UTC
- cron: "45 16 * * *"

permissions:
contents: write

jobs:
run:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

- name: Setup Python
uses: actions/setup-python@v5
with:
python-version: "3.11"

- name: Install deps
run: pip install -r requirements.txt

- name: Export & mail
env:
EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
RUN_DATE: ${{ github.event.inputs.run_date }}
MODE: ${{ github.event.inputs.mode }}
AGENCY: ${{ github.event.inputs.agency }}
INITIALS: ${{ github.event.inputs.initials }}
USER_ID: ${{ github.event.inputs.user_id }}
run: python scripts/export_and_mail.py

- name: Commit monthly cumul (data/)
run: |
git config user.name "prospection-bot"
git config user.email "prospection-bot@users.noreply.github.com"

git add data/ || true
if git diff --cached --quiet; then
echo "No cumul changes to commit."
exit 0
fi

git commit -m "Update monthly cumul"
git push