name: Prospection - Export & Mail

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "individual | agency_manager | admin"
        required: false
        default: "agency_manager"
      run_date:
        description: "Date (YYYY-MM-DD). Vide = aujourd'hui (UTC runner)"
        required: false
        default: ""
      agency:
        description: "GR | VR | GRS | SLS (utile si mode=individual)"
        required: false
        default: ""
      initials:
        description: "Initiales (utile si mode=individual)"
        required: false
        default: ""
  schedule:
    # GitHub = UTC. Ajuste selon heure souhaitée FR.
    - cron: "45 16 * * *"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run export & mail
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: "Prospection Bot"

          MAIL_ROUTING_JSON: ${{ secrets.MAIL_ROUTING_JSON }}

          SEND_MODE: ${{ inputs.mode }}
          RUN_DATE: ${{ inputs.run_date }}
          AGENCY: ${{ inputs.agency }}
          INITIALS: ${{ inputs.initials }}
        run: |
          python scripts/export_and_mail.py