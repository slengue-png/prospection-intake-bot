name: Prospection — Export & Mail

on:
  schedule:
    # GitHub Actions = UTC
    - cron: "30 11 * * *"   # 12:30 FR (hiver)
    - cron: "0 16 * * *"    # 17:00 FR (hiver)
  workflow_dispatch:
    inputs:
      run_date:
        description: "Date YYYY-MM-DD (optionnel)"
        required: false
        default: ""
      agency:
        description: "Agence (optionnel)"
        required: false
        default: ""
      initials:
        description: "Initiales (optionnel)"
        required: false
        default: ""
      visits_clients:
        description: "Clôture: visites clients (optionnel)"
        required: false
        default: ""
      visits_prospects:
        description: "Clôture: visites prospects (optionnel)"
        required: false
        default: ""
      commandes:
        description: "Clôture: commandes (optionnel)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Export & mail
        env:
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

          # IMPORTANT: RUN_DATE taken from dispatch input if provided
          RUN_DATE: ${{ github.event.inputs.run_date }}

          # Optional close stats (if you want to inject into email later)
          CLOSE_AGENCY: ${{ github.event.inputs.agency }}
          CLOSE_INITIALS: ${{ github.event.inputs.initials }}
          CLOSE_VISITS_CLIENTS: ${{ github.event.inputs.visits_clients }}
          CLOSE_VISITS_PROSPECTS: ${{ github.event.inputs.visits_prospects }}
          CLOSE_COMMANDES: ${{ github.event.inputs.commandes }}
        run: python scripts/export_and_mail.py

      - name: Commit monthly cumul (data/)
        run: |
          git config user.name "prospection-bot"
          git config user.email "prospection-bot@users.noreply.github.com"

          git add data/ || true
          if git diff --cached --quiet; then
            echo "No cumul changes to commit."
            exit 0
          fi

          git commit -m "Update monthly cumul"
          git push