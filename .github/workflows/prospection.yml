name: Prospection - Export & Mail

on:
  schedule:
    - cron: "45 16 * * *"   # ~18:45 France été / à ajuster si besoin
  workflow_dispatch:
    inputs:
      run_date:
        description: "Date (YYYY-MM-DD). Vide = aujourd'hui"
        required: false
        default: ""

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run export
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: "Prospection Bot"

          MAIL_ROUTING_JSON: ${{ secrets.MAIL_ROUTING_JSON }}

          SEND_MODE: "agency_manager"
          RUN_DATE: ${{ inputs.run_date }}
        run: |
          python scripts/export_and_mail.py
