name: Prospection - Cloture Session

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Date au format YYYY-MM-DD"
        required: true
      agency:
        description: "Agence (GR, VR, GRS, SLS)"
        required: true
      initials:
        description: "Initiales collaborateur"
        required: true

jobs:
  run-export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run export session
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXPORT_BASE_URL: ${{ secrets.EXPORT_BASE_URL }}
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MODE: "session"
          RUN_DATE: ${{ inputs.run_date }}
          AGENCY: ${{ inputs.agency }}
          INITIALS: ${{ inputs.initials }}
        run: |
          python scripts/export_and_mail.py