name: Prospection

# =====================================================

# PROSPECTION WORKFLOW — V2 OPTIMISÉ

# 

# Corrections appliquées :

# - Timezone UTC/Paris corrigée (hiver + été)

# - Cache pip + apt (Tesseract)

# - Concurrency group (anti-doublons)

# - Timeout job global (30 min)

# - Notification Telegram en cas d’échec

# - Validation des inputs avant exécution

# - Artifacts Excel (filet de sécurité si Brevo KO)

# - pip-audit (détection CVE dépendances)

# - Inputs VISITS_* supprimés (inutilisés, lus via KV)

# - MAX_OCR_IMAGES / MAX_PHOTO_IMAGES en inputs optionnels

# =====================================================

on:
workflow_dispatch:
inputs:
mode:
description: “individual | agency_manager | admin”
required: true
default: “individual”
type: choice
options:
- individual
- agency_manager
- admin
run_date:
description: “YYYY-MM-DD Europe/Paris (laisser vide = aujourd’hui)”
required: false
type: string
agency:
description: “GR | VR | GRS | SLS (requis si individual ou agency_manager)”
required: false
type: string
initials:
description: “Ex: JL, CZ, AC… (requis si individual)”
required: false
type: string
max_ocr_images:
description: “Nb max images OCR (défaut: 50)”
required: false
default: “50”
type: string
max_photo_images:
description: “Nb max images mode photo (défaut: 15)”
required: false
default: “15”
type: string

schedule:
# ── HIVER (UTC+1) : 17h45 Paris = 16h45 UTC ──────────────────────────────
- cron: “45 16 * * 1-5”   # agency_manager — lun-ven hiver
- cron: “47 16 * * 1-5”   # admin          — lun-ven hiver
# ── ÉTÉ  (UTC+2) : 17h45 Paris = 15h45 UTC ──────────────────────────────
- cron: “45 15 * * 1-5”   # agency_manager — lun-ven été
- cron: “47 15 * * 1-5”   # admin          — lun-ven été
# Note : le passage heure d’été/hiver se fait fin mars / fin octobre.
# Les 4 crons tournent toute l’année ; le step “Determine mode”
# filtre selon l’heure locale réelle calculée au runtime.

# ── Anti-doublons : un seul run par mode en parallèle ─────────────────────────

concurrency:
group: prospection-${{ github.event_name == ‘schedule’ && github.event.schedule || inputs.mode }}
cancel-in-progress: false   # Ne jamais annuler un run en cours (données critiques)

# ── Timeout global (protection contre boucles Gemini / réseau) ────────────────

jobs:
export_and_mail:
runs-on: ubuntu-latest
timeout-minutes: 30

```
steps:
  # ── 0. Validation des inputs (fail-fast avant tout traitement) ──────────
  - name: Validate inputs
    run: |
      MODE="${{ inputs.mode }}"
      AGENCY="${{ inputs.agency }}"
      INITIALS="${{ inputs.initials }}"
      RUN_DATE="${{ inputs.run_date }}"

      # Validation uniquement pour workflow_dispatch
      if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

        # Mode valide
        if [[ ! "$MODE" =~ ^(individual|agency_manager|admin)$ ]]; then
          echo "::error::SEND_MODE invalide : '$MODE'. Valeurs acceptées : individual | agency_manager | admin"
          exit 1
        fi

        # individual => agency + initials obligatoires
        if [ "$MODE" = "individual" ]; then
          if [ -z "$AGENCY" ]; then
            echo "::error::AGENCY requis pour le mode individual"
            exit 1
          fi
          if [ -z "$INITIALS" ]; then
            echo "::error::INITIALS requis pour le mode individual"
            exit 1
          fi
        fi

        # agency_manager => agency obligatoire
        if [ "$MODE" = "agency_manager" ] && [ -z "$AGENCY" ]; then
          echo "::error::AGENCY requis pour le mode agency_manager"
          exit 1
        fi

        # Format date si fournie
        if [ -n "$RUN_DATE" ]; then
          if ! [[ "$RUN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::RUN_DATE invalide : '$RUN_DATE'. Format attendu : YYYY-MM-DD"
            exit 1
          fi
        fi

        # Agence dans la liste autorisée
        if [ -n "$AGENCY" ]; then
          if [[ ! "$AGENCY" =~ ^(GR|VR|GRS|SLS)$ ]]; then
            echo "::error::AGENCY invalide : '$AGENCY'. Valeurs acceptées : GR | VR | GRS | SLS"
            exit 1
          fi
        fi

      fi
      echo "✅ Inputs validés."

  # ── 1. Checkout ─────────────────────────────────────────────────────────
  - name: Checkout
    uses: actions/checkout@v4

  # ── 2. Python ───────────────────────────────────────────────────────────
  - name: Set up Python 3.11
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  # ── 3. Cache APT / Tesseract ────────────────────────────────────────────
  - name: Cache apt packages
    uses: awalsh128/cache-apt-pkgs-action@latest
    with:
      packages: tesseract-ocr tesseract-ocr-fra libmagic1
      version: 1.0

  # ── 4. Install system deps (fallback si cache miss) ─────────────────────
  - name: Install system deps (tesseract + libmagic)
    run: |
      if ! command -v tesseract &> /dev/null; then
        sudo apt-get update -qq
        sudo apt-get install -y tesseract-ocr tesseract-ocr-fra libmagic1
      else
        echo "✅ Tesseract déjà en cache."
      fi

  # ── 5. Cache pip ────────────────────────────────────────────────────────
  - name: Cache pip
    uses: actions/cache@v4
    with:
      path: ~/.cache/pip
      key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      restore-keys: |
        ${{ runner.os }}-pip-

  # ── 6. Install python deps ──────────────────────────────────────────────
  - name: Install python deps
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  # ── 7. Audit sécurité des dépendances ───────────────────────────────────
  - name: Audit dependencies (CVE check)
    run: |
      pip install pip-audit --quiet
      pip-audit -r requirements.txt --desc on
    continue-on-error: true   # Avertissement non bloquant (à passer en false après stabilisation)

  # ── 8. Determine mode (schedule vs dispatch + correction timezone) ───────
  - name: Determine mode & date
    id: ctx
    run: |
      MODE="${{ inputs.mode }}"
      RUN_DATE="${{ inputs.run_date }}"

      if [ "${{ github.event_name }}" = "schedule" ]; then
        # Heure locale Paris au moment du run
        PARIS_HOUR=$(TZ="Europe/Paris" date +%H)
        PARIS_MIN=$(TZ="Europe/Paris" date +%M)
        echo "⏰ Heure Paris : ${PARIS_HOUR}h${PARIS_MIN}"

        # Les deux schedules déclenchent entre 15h45 et 16h47 UTC.
        # On identifie le bon mode selon la minute locale.
        # agency_manager = :45, admin = :47
        if [ "$PARIS_MIN" -le "46" ]; then
          MODE="agency_manager"
        else
          MODE="admin"
        fi
        echo "📋 Mode schedule détecté : $MODE"
      fi

      # Date par défaut = aujourd'hui Paris
      if [ -z "$RUN_DATE" ]; then
        RUN_DATE=$(TZ="Europe/Paris" date +%Y-%m-%d)
        echo "📅 Date calculée (Paris) : $RUN_DATE"
      fi

      echo "mode=$MODE"      >> $GITHUB_OUTPUT
      echo "run_date=$RUN_DATE" >> $GITHUB_OUTPUT

  # ── 9. Run export & mail ────────────────────────────────────────────────
  - name: Run export & mail
    env:
      # Requis
      WORKER_BASE_URL:    ${{ secrets.WORKER_BASE_URL }}
      EXPORT_TOKEN:       ${{ secrets.EXPORT_TOKEN }}
      TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
      BREVO_API_KEY:      ${{ secrets.BREVO_API_KEY }}
      BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
      BREVO_SENDER_NAME:  ${{ secrets.BREVO_SENDER_NAME }}
      MAIL_ROUTING_JSON:  ${{ secrets.MAIL_ROUTING_JSON }}

      # Optionnels (V2 Photo)
      GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_PLACES_API_KEY:  ${{ secrets.GOOGLE_PLACES_API_KEY }}

      # Contexte run
      SEND_MODE:  ${{ steps.ctx.outputs.mode }}
      RUN_DATE:   ${{ steps.ctx.outputs.run_date }}
      AGENCY:     ${{ inputs.agency }}
      INITIALS:   ${{ inputs.initials }}

      # Tuning (modifiables via dispatch sans toucher au workflow)
      MAX_OCR_IMAGES:   ${{ inputs.max_ocr_images || '50' }}
      MAX_PHOTO_IMAGES: ${{ inputs.max_photo_images || '15' }}

    run: |
      echo "🚀 Lancement — mode=$SEND_MODE date=$RUN_DATE agency=$AGENCY initials=$INITIALS"
      python scripts/export_and_mail.py

  # ── 10. Upload Excel en artifact (filet de sécurité si Brevo KO) ────────
  - name: Upload Excel artifacts
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: prospection-${{ steps.ctx.outputs.mode }}-${{ steps.ctx.outputs.run_date }}-${{ github.run_id }}
      path: "*.xlsx"
      retention-days: 7
      if-no-files-found: ignore   # Ne pas échouer si aucun Excel (ex: run annulé en validation)

  # ── 11. Notification Telegram en cas d'échec ─────────────────────────────
  - name: Notify failure via Telegram
    if: failure()
    env:
      TELEGRAM_TOKEN:        ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
    run: |
      MSG="⚠️ *Workflow PROSPECTION FAILED*%0A"
      MSG+="Mode : ${{ steps.ctx.outputs.mode }}%0A"
      MSG+="Date : ${{ steps.ctx.outputs.run_date }}%0A"
      MSG+="Agency : ${{ inputs.agency }}%0A"
      MSG+="Run ID : ${{ github.run_id }}%0A"
      MSG+="Lien : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      curl -s -X POST \
        "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
        -d "chat_id=${TELEGRAM_ADMIN_CHAT_ID}" \
        -d "text=${MSG}" \
        -d "parse_mode=Markdown" \
        --max-time 10 \
        --retry 3 \
        --retry-delay 2
```