name: Prospection

on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        default: "individual"
        type: choice
        options:
          - individual
          - agency_manager
          - admin
      run_date:
        required: false
        type: string
      agency:
        required: false
        type: string
      initials:
        required: false
        type: string

  schedule:
    - cron: "45 16 * * *"   # 17:45 France
    - cron: "47 16 * * *"   # 17:47 France

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-fra
      - run: pip install -r requirements.txt

      - name: Determine Mode
        id: mode
        run: |
          MODE="${{ inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "45 16 * * *" ]; then
              MODE="agency_manager"
            else
              MODE="admin"
            fi
          fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT

      - name: Run Export
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}

          MAIL_ROUTING_JSON: ${{ secrets.MAIL_ROUTING_JSON }}

          RUN_DATE: ${{ inputs.run_date }}
          AGENCY: ${{ inputs.agency }}
          INITIALS: ${{ inputs.initials }}
          SEND_MODE: ${{ steps.mode.outputs.mode }}

        run: python scripts/export_and_mail.py
