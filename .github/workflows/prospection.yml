# .github/workflows/prospection.yml
name: Prospection

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "individual | agency_manager | admin"
        required: true
        default: "individual"
        type: string
      run_date:
        description: "YYYY-MM-DD Europe/Paris (optionnel)"
        required: false
        type: string
      agency:
        description: "GR/VR/GRS/SLS (requis si individual)"
        required: false
        type: string
      initials:
        description: "JL/CZ/JB/LB/PV/ST/AC/SL (requis si individual)"
        required: false
        type: string
      visits_clients:
        description: "(optionnel) Nb clients"
        required: false
        default: ""
        type: string
      visits_prospects:
        description: "(optionnel) Nb prospects"
        required: false
        default: ""
        type: string
      commandes:
        description: "(optionnel) Nb commandes"
        required: false
        default: ""
        type: string

  # ⚠️ GitHub schedules run in UTC (not Europe/Paris)
  # 16:45 UTC ≈ 17:45 FR (winter) / 18:45 FR (summer)
  schedule:
    - cron: "45 16 * * *"   # 17:45 FR approx (agency managers)
    - cron: "47 16 * * *"   # 17:47 FR approx (admin SL)

jobs:
  export_and_mail:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute mode + run_date (Europe/Paris)
        id: meta
        run: |
          MODE="${{ inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "45 16 * * *" ]; then
              MODE="agency_manager"
            else
              MODE="admin"
            fi
          fi

          # RUN_DATE: input if provided; else date in Europe/Paris
          if [ -n "${{ inputs.run_date }}" ]; then
            RUN_DATE="${{ inputs.run_date }}"
          else
            RUN_DATE=$(TZ="Europe/Paris" date +%F)
          fi

          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "run_date=$RUN_DATE" >> $GITHUB_OUTPUT

      - name: Run export & mail
        env:
          # Worker
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}

          # Telegram (OCR cartes de visite)
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

          # Brevo
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}

          # Routage emails (JSON)
          MAIL_ROUTING_JSON: ${{ secrets.MAIL_ROUTING_JSON }}

          # Mode calculé (schedule) ou choisi (dispatch)
          SEND_MODE: ${{ steps.meta.outputs.mode }}

          # Date calculée en Europe/Paris si schedule
          RUN_DATE: ${{ steps.meta.outputs.run_date }}

          # Optionnels: requis seulement si SEND_MODE=individual
          AGENCY: ${{ inputs.agency }}
          INITIALS: ${{ inputs.initials }}

          # Optionnels (compat / logs)
          VISITS_CLIENTS: ${{ inputs.visits_clients }}
          VISITS_PROSPECTS: ${{ inputs.visits_prospects }}
          COMMANDES: ${{ inputs.commandes }}

          # OCR safety
          MAX_OCR_IMAGES: "50"

        run: |
          python scripts/export_and_mail.py