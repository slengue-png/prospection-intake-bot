# .github/workflows/prospection.yml
name: Prospection

# =====================================================
# PROSPECTION WORKFLOW — V2 OPTIMISÉ (Option B DST auto)
#
# ✅ V1 stable conservée (Worker inchangé)
# ✅ 4 crons (été/hiver) MAIS "guard" runtime => seuls 17:45 & 17:47 Paris exécutent
# ✅ Concurrency anti-doublons (par mode)
# ✅ Timeout global
# ✅ Cache pip + apt (tesseract)
# ✅ Artifacts Excel (filet sécurité)
# ✅ pip-audit (non bloquant)
# ✅ Notification Telegram si échec
# ✅ Inputs validés (workflow_dispatch)
# =====================================================

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "individual | agency_manager | admin"
        required: true
        default: "individual"
        type: choice
        options:
          - individual
          - agency_manager
          - admin
      run_date:
        description: "YYYY-MM-DD Europe/Paris (laisser vide = aujourd'hui Paris)"
        required: false
        type: string
      agency:
        description: "GR | VR | GRS | SLS (requis si individual ou agency_manager)"
        required: false
        type: string
      initials:
        description: "Ex: JL, CZ, JB, LB, PV, ST, AC, SL (requis si individual)"
        required: false
        type: string
      max_ocr_images:
        description: "Nb max images OCR (defaut: 50)"
        required: false
        default: "50"
        type: string
      max_photo_images:
        description: "Nb max images mode photo (defaut: 15)"
        required: false
        default: "15"
        type: string

  schedule:
    # ── HIVER (UTC+1) : 17:45 Paris = 16:45 UTC ───────────────────────────
    - cron: "45 16 * * 1-5"   # target 17:45 Paris
    - cron: "47 16 * * 1-5"   # target 17:47 Paris
    # ── ÉTÉ  (UTC+2) : 17:45 Paris = 15:45 UTC ───────────────────────────
    - cron: "45 15 * * 1-5"   # target 17:45 Paris
    - cron: "47 15 * * 1-5"   # target 17:47 Paris

concurrency:
  # Anti-doublons: un seul run par "mode" à la fois (schedule => computed, dispatch => inputs.mode)
  group: prospection-${{ github.event_name == 'schedule' && github.run_id || inputs.mode }}
  cancel-in-progress: false

jobs:
  export_and_mail:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 0. Validation inputs (uniquement workflow_dispatch) ──────────────
      - name: Validate inputs (dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          MODE="${{ inputs.mode }}"
          AGENCY="${{ inputs.agency }}"
          INITIALS="${{ inputs.initials }}"
          RUN_DATE="${{ inputs.run_date }}"

          if [[ ! "$MODE" =~ ^(individual|agency_manager|admin)$ ]]; then
            echo "::error::mode invalide: '$MODE' (individual|agency_manager|admin)"
            exit 1
          fi

          if [ "$MODE" = "individual" ]; then
            if [ -z "$AGENCY" ]; then
              echo "::error::AGENCY requis pour mode=individual"
              exit 1
            fi
            if [ -z "$INITIALS" ]; then
              echo "::error::INITIALS requis pour mode=individual"
              exit 1
            fi
          fi

          if [ "$MODE" = "agency_manager" ] && [ -z "$AGENCY" ]; then
            echo "::error::AGENCY requis pour mode=agency_manager"
            exit 1
          fi

          if [ -n "$RUN_DATE" ]; then
            if ! [[ "$RUN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::RUN_DATE invalide: '$RUN_DATE' (YYYY-MM-DD)"
              exit 1
            fi
          fi

          if [ -n "$AGENCY" ]; then
            if [[ ! "$AGENCY" =~ ^(GR|VR|GRS|SLS)$ ]]; then
              echo "::error::AGENCY invalide: '$AGENCY' (GR|VR|GRS|SLS)"
              exit 1
            fi
          fi

          echo "✅ Inputs validés."

      # ── 1. Checkout ─────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python ───────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Cache APT packages (tesseract) ────────────────────────────────
      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: tesseract-ocr tesseract-ocr-fra libmagic1
          version: 1.0

      # ── 4. Install system deps (fallback si cache miss) ─────────────────
      - name: Install system deps (tesseract + libmagic)
        run: |
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y tesseract-ocr tesseract-ocr-fra libmagic1
          else
            echo "✅ Tesseract déjà présent (cache)."
          fi

      # ── 5. Cache pip ────────────────────────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── 6. Install python deps ──────────────────────────────────────────
      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 7. Audit dépendances (non bloquant) ─────────────────────────────
      - name: Audit dependencies (CVE check)
        continue-on-error: true
        run: |
          pip install pip-audit --quiet
          pip-audit -r requirements.txt --desc on

      # ── 8. Determine mode + date + GUARD DST ────────────────────────────
      - name: Determine context (mode/date) + schedule guard
        id: ctx
        run: |
          MODE="${{ inputs.mode }}"
          RUN_DATE="${{ inputs.run_date }}"
          SHOULD_RUN="1"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            PARIS_HOUR=$(TZ="Europe/Paris" date +%H)
            PARIS_MIN=$(TZ="Europe/Paris" date +%M)
            echo "⏰ Paris now: ${PARIS_HOUR}:${PARIS_MIN}"

            # Guard: on n'exécute QUE si on est exactement à 17:45 ou 17:47 Paris
            if [ "$PARIS_HOUR" = "17" ] && [ "$PARIS_MIN" = "45" ]; then
              MODE="agency_manager"
            elif [ "$PARIS_HOUR" = "17" ] && [ "$PARIS_MIN" = "47" ]; then
              MODE="admin"
            else
              SHOULD_RUN="0"
              MODE="skip"
              echo "🟡 Guard: pas l'heure cible (17:45/17:47 Paris). Run ignoré."
            fi
          fi

          # Date par défaut = aujourd'hui Paris
          if [ -z "$RUN_DATE" ]; then
            RUN_DATE=$(TZ="Europe/Paris" date +%Y-%m-%d)
          fi

          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "run_date=$RUN_DATE" >> $GITHUB_OUTPUT
          echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT

      # ── 9. Skip si guard KO (schedule hors cible) ───────────────────────
      - name: Skip (schedule guard)
        if: ${{ steps.ctx.outputs.should_run != '1' }}
        run: |
          echo "✅ Skip propre: schedule hors 17:45/17:47 Paris."
          exit 0

      # ── 10. Run export & mail ───────────────────────────────────────────
      - name: Run export & mail
        env:
          # Requis
          WORKER_BASE_URL:    ${{ secrets.WORKER_BASE_URL }}
          EXPORT_TOKEN:       ${{ secrets.EXPORT_TOKEN }}
          TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
          BREVO_API_KEY:      ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME:  ${{ secrets.BREVO_SENDER_NAME }}
          MAIL_ROUTING_JSON:  ${{ secrets.MAIL_ROUTING_JSON }}

          # Optionnels (V2)
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}

          # Contexte run
          SEND_MODE:  ${{ steps.ctx.outputs.mode }}
          RUN_DATE:   ${{ steps.ctx.outputs.run_date }}
          AGENCY:     ${{ inputs.agency }}
          INITIALS:   ${{ inputs.initials }}

          # Tuning
          MAX_OCR_IMAGES:   ${{ inputs.max_ocr_images }}
          MAX_PHOTO_IMAGES: ${{ inputs.max_photo_images }}

        run: |
          echo "🚀 Lancement — mode=$SEND_MODE date=$RUN_DATE agency=$AGENCY initials=$INITIALS"
          python scripts/export_and_mail.py

      # ── 11. Upload Excel artifacts (filet de sécurité) ───────────────────
      - name: Upload Excel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospection-${{ steps.ctx.outputs.mode }}-${{ steps.ctx.outputs.run_date }}-${{ github.run_id }}
          path: "*.xlsx"
          retention-days: 7
          if-no-files-found: ignore

      # ── 12. Notification Telegram en cas d'échec ─────────────────────────
      - name: Notify failure via Telegram
        if: failure()
        env:
          TELEGRAM_TOKEN:         ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_ADMIN_CHAT_ID" ]; then
            echo "TELEGRAM_ADMIN_CHAT_ID manquant: notif ignorée."
            exit 0
          fi

          MSG="⚠️ *Workflow PROSPECTION FAILED*%0A"
          MSG="${MSG}Mode : ${{ steps.ctx.outputs.mode }}%0A"
          MSG="${MSG}Date : ${{ steps.ctx.outputs.run_date }}%0A"
          MSG="${MSG}Agency : ${{ inputs.agency }}%0A"
          MSG="${MSG}Run ID : ${{ github.run_id }}%0A"
          MSG="${MSG}Repo : ${{ github.repository }}%0A"
          MSG="${MSG}Lien : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_ADMIN_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown" \
            --max-time 10 \
            --retry 3 \
            --retry-delay 2