name: Prospection — Export & Mail

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Date optionnelle (YYYY-MM-DD). Exemple: 2026-02-20"
        required: false
        default: ""

  schedule:
    # GitHub Actions = UTC
    # 12:30 FR (hiver) = 11:30 UTC
    # 17:45 FR (hiver) = 16:45 UTC
    - cron: "30 11 * * *"
    - cron: "45 16 * * *"

permissions:
  contents: write

jobs:
  export_and_mail:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export & mail
        env:
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          RUN_DATE: ${{ github.event.inputs.run_date }}
        run: |
          python scripts/export_and_mail.py

      - name: Commit monthly cumul (data/)
        run: |
          git config user.name "prospection-bot"
          git config user.email "prospection-bot@users.noreply.github.com"

          git add data/ || true
          if git diff --cached --quiet; then
            echo "No cumul changes to commit."
            exit 0
          fi

          git commit -m "Update monthly cumul"
          git push