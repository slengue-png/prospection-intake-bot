name: Prospection — Export & Mail

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode (daily | close_session)"
        required: false
        default: "close_session"
      agency:
        description: "Agence (ex: GR)"
        required: false
        default: ""
      initials:
        description: "Initiales (ex: JL)"
        required: false
        default: ""
      clients:
        description: "Nb visites clients"
        required: false
        default: "0"
      prospects:
        description: "Nb visites prospects"
        required: false
        default: "0"
      run_date:
        description: "Date optionnelle (YYYY-MM-DD) - vide = aujourd'hui UTC"
        required: false
        default: ""

  schedule:
    - cron: "30 11 * * *"
    - cron: "0 16 * * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements.txt

      # OCR tesseract (gratuit) pour carte de visite
      - name: Install OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Export & mail
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}

          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}

          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

          MODE: ${{ github.event.inputs.mode }}
          AGENCY: ${{ github.event.inputs.agency }}
          INITIALS: ${{ github.event.inputs.initials }}
          CLIENTS: ${{ github.event.inputs.clients }}
          PROSPECTS: ${{ github.event.inputs.prospects }}
          RUN_DATE: ${{ github.event.inputs.run_date }}

        run: python scripts/export_and_mail.py

      - name: Commit monthly cumul (data/)
        run: |
          git config user.name "prospection-bot"
          git config user.email "prospection-bot@users.noreply.github.com"

          git add data/ || true
          if git diff --cached --quiet; then
            echo "No cumul changes to commit."
            exit 0
          fi

          git commit -m "Update monthly cumul"
          git push