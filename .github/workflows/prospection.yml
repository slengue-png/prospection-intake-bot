name: Prospection

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'envoi"
        required: true
        default: "individual"
        type: choice
        options:
          - individual
          - agency_manager
          - admin
      run_date:
        description: "Date (YYYY-MM-DD) Europe/Paris — vide = aujourd'hui"
        required: false
        type: string
      agency:
        description: "Agence (requis si mode=individual)"
        required: false
        type: choice
        options:
          - ""
          - GR
          - VR
          - GRS
          - SLS
      initials:
        description: "Initiales (requis si mode=individual)"
        required: false
        type: choice
        options:
          - ""
          - JL
          - CZ
          - JB
          - LB
          - PV
          - ST
          - AC
          - SL
      max_ocr_images:
        description: "Max cartes à traiter (défaut 50)"
        required: false
        default: "50"
        type: choice
        options:
          - "10"
          - "20"
          - "30"
          - "50"
          - "80"
          - "120"
      max_photo_images:
        description: "Max photos à traiter (défaut 15)"
        required: false
        default: "15"
        type: choice
        options:
          - "5"
          - "10"
          - "15"
          - "25"
          - "40"

  schedule:
    # HIVER (UTC+1) : 17:45 Paris = 16:45 UTC / 17:47 Paris = 16:47 UTC
    - cron: "45 16 * * 1-5"
    - cron: "47 16 * * 1-5"
    # ÉTÉ (UTC+2) : 17:45 Paris = 15:45 UTC / 17:47 Paris = 15:47 UTC
    - cron: "45 15 * * 1-5"
    - cron: "47 15 * * 1-5"

concurrency:
  group: prospection-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export_and_mail:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ------------------------------------------------------------
      # 0) Validation inputs (uniquement si workflow_dispatch)
      # ------------------------------------------------------------
      - name: Validate inputs (dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          MODE="${{ inputs.mode }}"
          RUN_DATE="${{ inputs.run_date }}"
          AGENCY="${{ inputs.agency }}"
          INITIALS="${{ inputs.initials }}"

          if [[ ! "$MODE" =~ ^(individual|agency_manager|admin)$ ]]; then
            echo "::error::mode invalide: '$MODE'"
            exit 1
          fi

          if [ "$MODE" = "individual" ]; then
            if [ -z "$AGENCY" ]; then
              echo "::error::AGENCY requis pour mode=individual"
              exit 1
            fi
            if [ -z "$INITIALS" ]; then
              echo "::error::INITIALS requis pour mode=individual"
              exit 1
            fi
          fi

          if [ -n "$RUN_DATE" ] && ! [[ "$RUN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::RUN_DATE invalide: '$RUN_DATE' (YYYY-MM-DD)"
            exit 1
          fi

          echo "✅ Inputs validés."

      # ------------------------------------------------------------
      # 1) Checkout + Python
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------------------------
      # 2) Dépendances système (tesseract + libs OpenCV/torch)
      # ------------------------------------------------------------
      - name: Install system deps
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            tesseract-ocr tesseract-ocr-fra libmagic1 \
            libgl1 libglib2.0-0 libgomp1

          tesseract --version || true

      # ------------------------------------------------------------
      # 3) Cache pip + install deps Python
      # ------------------------------------------------------------
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install python deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------
      # 4) Détermination contexte (schedule -> mode auto)
      # ------------------------------------------------------------
      - name: Determine context (mode/date) + schedule guard
        id: ctx
        shell: bash
        run: |
          MODE="${{ inputs.mode }}"
          RUN_DATE="${{ inputs.run_date }}"
          SHOULD_RUN="1"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            PARIS_HOUR=$(TZ="Europe/Paris" date +%H)
            PARIS_MIN=$(TZ="Europe/Paris" date +%M)
            echo "⏰ Paris now: ${PARIS_HOUR}:${PARIS_MIN}"

            if [ "$PARIS_HOUR" = "17" ] && [ "$PARIS_MIN" = "45" ]; then
              MODE="agency_manager"
            elif [ "$PARIS_HOUR" = "17" ] && [ "$PARIS_MIN" = "47" ]; then
              MODE="admin"
            else
              SHOULD_RUN="0"
              MODE="skip"
              echo "🟡 Guard: pas l'heure cible (17:45/17:47 Paris). Run ignoré."
            fi
          fi

          if [ -z "$RUN_DATE" ]; then
            RUN_DATE=$(TZ="Europe/Paris" date +%Y-%m-%d)
          fi

          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "run_date=$RUN_DATE" >> $GITHUB_OUTPUT
          echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT

      - name: Skip (schedule guard)
        if: ${{ steps.ctx.outputs.should_run != '1' }}
        shell: bash
        run: |
          echo "✅ Skip propre: schedule hors 17:45/17:47 Paris."
          exit 0

      # ------------------------------------------------------------
      # 5) Run script
      # ------------------------------------------------------------
      - name: Run export & mail
        shell: bash
        env:
          WORKER_BASE_URL:        ${{ secrets.WORKER_BASE_URL }}
          EXPORT_TOKEN:           ${{ secrets.EXPORT_TOKEN }}
          TELEGRAM_TOKEN:         ${{ secrets.TELEGRAM_TOKEN }}

          BREVO_API_KEY:          ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL:     ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME:      ${{ secrets.BREVO_SENDER_NAME }}
          MAIL_ROUTING_JSON:      ${{ secrets.MAIL_ROUTING_JSON }}

          GOOGLE_PLACES_API_KEY:  ${{ secrets.GOOGLE_PLACES_API_KEY }}

          SEND_MODE:              ${{ steps.ctx.outputs.mode }}
          RUN_DATE:               ${{ steps.ctx.outputs.run_date }}
          AGENCY:                 ${{ inputs.agency }}
          INITIALS:               ${{ inputs.initials }}

          MAX_OCR_IMAGES:         ${{ inputs.max_ocr_images || '50' }}
          MAX_PHOTO_IMAGES:       ${{ inputs.max_photo_images || '15' }}

          OUT_DIR:                out
        run: |
          echo "🚀 Lancement — mode=$SEND_MODE date=$RUN_DATE agency=$AGENCY initials=$INITIALS"
          python scripts/export_and_mail.py

      # ------------------------------------------------------------
      # 6) Upload artifacts
      # ------------------------------------------------------------
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospection-${{ steps.ctx.outputs.mode }}-${{ steps.ctx.outputs.run_date }}-${{ github.run_id }}
          path: |
            out/**/*.xlsx
            out/**/*.zip
          retention-days: 7
          if-no-files-found: ignore

      # ------------------------------------------------------------
      # 7) Telegram notif (optionnel)
      # ------------------------------------------------------------
      - name: Notify failure via Telegram
        if: failure()
        shell: bash
        env:
          TELEGRAM_TOKEN:         ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_ADMIN_CHAT_ID" ]; then
            echo "TELEGRAM_ADMIN_CHAT_ID manquant: notif ignorée."
            exit 0
          fi

          MSG="⚠️ *Workflow PROSPECTION FAILED*%0A"
          MSG="${MSG}Mode : ${{ steps.ctx.outputs.mode }}%0A"
          MSG="${MSG}Date : ${{ steps.ctx.outputs.run_date }}%0A"
          MSG="${MSG}Agency : ${{ inputs.agency }}%0A"
          MSG="${MSG}Run ID : ${{ github.run_id }}%0A"
          MSG="${MSG}Repo : ${{ github.repository }}%0A"
          MSG="${MSG}Lien : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_ADMIN_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown" \
            --max-time 10