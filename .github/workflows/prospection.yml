name: Prospection — Export & Mail

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Date (YYYY-MM-DD). Vide = aujourd’hui."
        required: false
        default: ""
      agency:
        description: "Agence (ex: GR)"
        required: false
        default: ""
      initials:
        description: "Initiales (ex: JL)"
        required: false
        default: ""
      clients:
        description: "Visites clients (nombre)"
        required: false
        default: "0"
      prospects:
        description: "Visites prospects (nombre)"
        required: false
        default: "0"
      mode:
        description: "daily"
        required: false
        default: "daily"

  schedule:
    # UTC (en hiver FR = UTC+1)
    - cron: "30 11 * * *"  # 12:30 FR
    - cron: "00 16 * * *"  # 17:00 FR

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Export & mail
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          # tes destinataires & config (si tu en as)
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}

          RUN_DATE: ${{ inputs.run_date }}
          AGENCY: ${{ inputs.agency }}
          INITIALS: ${{ inputs.initials }}
          CLIENTS: ${{ inputs.clients }}
          PROSPECTS: ${{ inputs.prospects }}
          MODE: ${{ inputs.mode }}
        run: |
          python scripts/export_and_mail.py