name: Prospection — Export & Mail

on:
  # 1) Déclenchement immédiat depuis le Worker (Clore session)
  repository_dispatch:
    types: [close_session]

  # 2) Envois automatiques du soir (GitHub Actions = UTC)
  schedule:
    # 17:45 FR (hiver) = 16:45 UTC
    - cron: "45 16 * * *"
    # 17:47 FR (hiver) = 16:47 UTC
    - cron: "47 16 * * *"

  # 3) Lancement manuel (debug)
  workflow_dispatch:
    inputs:
      run_date:
        description: "Date YYYY-MM-DD (optionnel)"
        required: false
      mode:
        description: "Optionnel: close_session | agency_digest | global_digest"
        required: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      # Détermine le MODE selon le type d'évènement
      - name: Set MODE
        id: mode
        run: |
          echo "EVENT_NAME=${{ github.event_name }}" >> $GITHUB_ENV
          echo "SCHEDULE=${{ github.event.schedule }}" >> $GITHUB_ENV

          # Par défaut
          MODE="${{ github.event.inputs.mode }}"

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            MODE="close_session"
          fi

          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "45 16 * * *" ]; then
              MODE="agency_digest"
            elif [ "${{ github.event.schedule }}" = "47 16 * * *" ]; then
              MODE="global_digest"
            fi
          fi

          if [ -z "$MODE" ]; then
            MODE="agency_digest"
          fi

          echo "MODE=$MODE" >> $GITHUB_ENV
          echo "Mode resolved: $MODE"

      - name: Export & mail
        env:
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          RUN_DATE: ${{ github.event.inputs.run_date }}
          MODE: ${{ env.MODE }}
          CLIENT_PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
        run: python scripts/export_and_mail.py

      - name: Commit monthly cumul (data/)
        run: |
          git config user.name "prospection-bot"
          git config user.email "prospection-bot@users.noreply.github.com"

          git add data/ || true
          if git diff --cached --quiet; then
            echo "No cumul changes to commit."
            exit 0
          fi

          git commit -m "Update monthly cumul"
          git push