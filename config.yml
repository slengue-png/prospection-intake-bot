# =========================
# PROSPECTION BOT — CONFIG
# =========================

# URL de ton Cloudflare Worker (base)
# Exemple: https://prospection-contact-bot.<ton-compte>.workers.dev
worker_base_url: "https://TON-WORKER.workers.dev"

# Pour cohérence des mails/exports (optionnel)
timezone: "Europe/Paris"

# Mail global (toi) — reçoit le récap global à 17:47
global_to:
  - "TON_MAIL@exemple.com"

# =========================
# AGENCES & COMMERCIAUX
# =========================
# Règles:
# - daily_digest_to : reçoit le mail "récap agence" (17:45)
# - users.<initiales>.email : reçoit le mail immédiat "Clôture session" quand le commercial clique "Clore session"
# - Tu peux ajouter d'autres users sans toucher au code

agencies:
  GR:
    label: "Grenoble"
    daily_digest_to:
      - "JL@exemple.com"     # récap agence (JL + CZ) envoyé à JL
    users:
      JL:
        name: "JL"
        email: "JL@exemple.com"
      CZ:
        name: "CZ"
        email: "CZ@exemple.com"

  VR:
    label: "Voiron"
    daily_digest_to:
      - "JB@exemple.com"     # récap agence (JB + LB) envoyé à JB
    users:
      JB:
        name: "JB"
        email: "JB@exemple.com"
      LB:
        name: "LB"
        email: "LB@exemple.com"

  GRS:
    label: "Grésivaudan"
    daily_digest_to:
      - "PV@exemple.com"     # récap agence (PV + ST) envoyé à PV
    users:
      PV:
        name: "PV"
        email: "PV@exemple.com"
      ST:
        name: "ST"
        email: "ST@exemple.com"

  SLS:
    label: "Salaise"
    daily_digest_to:
      - "AC@exemple.com"     # récap agence envoyé à AC
    users:
      AC:
        name: "AC"
        email: "AC@exemple.com"

# =========================
# OPTIONS EXPORT (facultatif)
# =========================
export:
  sheet_name: "IMPORT"
  filename_prefix: "PROSPECTION"
  include_header: true

# =========================
# LIMITES / QUOTAS (facultatif)
# =========================
# On gèrera à la fin comme tu l'as demandé, mais tu peux déjà poser le cadre ici.
quotas:
  google_places_requests_per_day: 120
  days_planned: 21